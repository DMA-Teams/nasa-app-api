name: nasa-app-api

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [internal]
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ..
      target: api
    environment:
      APP_ENV: production
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOMEMLIMIT: 420MiB
      LOG_LEVEL: info
      DIAG_ADDR: 0.0.0.0:6060
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 20s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:6060:6060"

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 256m

  etl:
    profiles: [etl]
    build:
      context: ..
      target: etl
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../data:/data:ro
    networks: [internal]
    mem_limit: 1g

networks:
  internal:

volumes:
  redis-data:
  caddy-data:
  caddy-config:
