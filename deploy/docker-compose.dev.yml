name: nasa-app-api-dev

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-dev-only-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-dev-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [dev]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      target: api
    environment:
      APP_ENV: development
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:5173}
      DIAG_ADDR: 0.0.0.0:6060
      LOG_LEVEL: debug
      VERSION_POLL_INTERVAL: 10s
      GOMEMLIMIT: 420MiB
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6060:6060"
    networks: [dev]
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 20s

  etl:
    profiles: [etl]
    build:
      context: ..
      target: etl
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
    volumes:
      - ../data:/data:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [dev]

networks:
  dev:

volumes:
  redis-dev-data:
